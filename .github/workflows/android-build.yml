name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || '' }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL || '' }}

      - name: Sync with Capacitor
        run: npx cap sync
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          CAPACITOR_CONFIG: capacitor.config.ts

      - name: Grant execute permission for Gradle
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-coach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload APK info
        if: always()
        run: |
          echo "## Проверь APK" >> $GITHUB_STEP_SUMMARY
          echo "- Скачай артефакт **ai-coach-apk** выше ^" >> $GITHUB_STEP_SUMMARY
          echo "- Распакуй zip — внутри **app-debug.apk**" >> $GITHUB_STEP_SUMMARY
          echo "- Установи на Android: Разреши установку из неизвестных источников" >> $GITHUB_STEP_SUMMARY
