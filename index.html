<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: https://*.convex.cloud 'unsafe-inline' 'unsafe-eval'; connect-src 'self' file: https://*.convex.cloud https://*.convex.site wss://*.convex.cloud; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AI Coach — твой спортивный тренер</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #splash.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 24px;
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.3); transform: scale(1); }
      50% { box-shadow: 0 0 60px rgba(139, 92, 246, 0.5); transform: scale(1.02); }
    }

    .splash-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .splash-subtitle {
      font-size: 14px;
      color: #a1a1aa;
      margin-bottom: 32px;
    }

    .splash-loader {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(139, 92, 246, 0.15);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .splash-error {
      display: none;
      text-align: center;
      padding: 20px;
      max-width: 300px;
    }

    .splash-error.show {
      display: block;
    }

    .splash-error h3 {
      color: #ef4444;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .splash-error p {
      color: #a1a1aa;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="splash-logo">🏃</div>
    <div class="splash-title">AI Coach</div>
    <div class="splash-subtitle">твой спортивный тренер</div>
    <div class="splash-loader" id="splashLoader"></div>
    <div class="splash-error" id="splashError">
      <h3>⚠️ Не удалось загрузить приложение</h3>
      <p id="splashErrorMessage"></p>
    </div>
  </div>

  <div id="root"></div>

  <script>
    // Hide splash when React mounts
    window.hideSplash = function() {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 700);
      }
    };

    // Show error if React fails to mount
    window.showSplashError = function(message) {
      const loader = document.getElementById('splashLoader');
      const error = document.getElementById('splashError');
      const errorMsg = document.getElementById('splashErrorMessage');
      if (loader) loader.style.display = 'none';
      if (error) error.classList.add('show');
      if (errorMsg) errorMsg.textContent = message || 'Проверьте подключение к интернету и перезапустите приложение';
    };

    // Timeout — если React не загрузился за 10 секунд, показать ошибку
    setTimeout(() => {
      const splash = document.getElementById('splash');
      if (splash && !splash.classList.contains('fade-out')) {
        window.showSplashError('Приложение загружается дольше обычного. Проверьте интернет-соединение.');
      }
    }, 10000);
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
