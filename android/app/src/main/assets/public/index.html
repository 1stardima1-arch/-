<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Athyx Connect</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0f;transition:opacity .6s ease,transform .6s ease}
    #splash.fade-out{opacity:0;transform:scale(1.05);pointer-events:none}
    .splash-logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;box-shadow:0 0 40px rgba(139,92,246,.3);animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 40px rgba(139,92,246,.3);transform:scale(1)}50%{box-shadow:0 0 60px rgba(139,92,246,.5);transform:scale(1.02)}}
    .splash-title{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px}
    .splash-subtitle{font-size:14px;color:#a1a1aa;margin-bottom:32px}
    .splash-loader{width:32px;height:32px;border:3px solid rgba(139,92,246,.15);border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .splash-error{display:none;text-align:center;padding:20px;max-width:300px}
    .splash-error.show{display:block}
    .splash-error h3{color:#ef4444;margin-bottom:8px;font-size:16px}
    .splash-error p{color:#a1a1aa;font-size:13px;line-height:1.5;margin-bottom:16px}
    .splash-error .retry-btn{display:inline-block;margin-top:4px;padding:10px 24px;background:#7c3aed;color:white;border:none;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
    .splash-error .retry-btn:active{background:#5b21b6}
    #root{min-height:100vh;min-height:100dvh}
  </style>
  <script type="module" src="/assets/index-BLjfX_2r.js"></script>
  <link rel="stylesheet" href="/assets/index-B1ux09vS.css">
</head>
<body>
  <div id="splash">
    <div class="splash-logo">🩸</div>
    <div class="splash-title">Athyx Connect</div>
    <div class="splash-subtitle">лактат → часы Garmin</div>
    <div class="splash-loader" id="splashLoader"></div>
    <div class="splash-error" id="splashError">
      <h3>⚠️ Сервер недоступен</h3>
      <p id="splashErrorMessage">Возможно, сервер заблокирован в вашем регионе. Попробуйте VPN.</p>
      <button class="retry-btn" onclick="location.reload()">Повторить попытку</button>
    </div>
  </div>
  <div id="root"></div>
  <script>
    window.hideSplash = function() { const s = document.getElementById('splash'); if(s){ s.classList.add('fade-out'); setTimeout(() => s.remove(), 700); } };
    window.showSplashError = function(m) { const l = document.getElementById('splashLoader'), e = document.getElementById('splashError'), em = document.getElementById('splashErrorMessage'); if(l) l.style.display='none'; if(e) e.classList.add('show'); if(em) em.textContent = m || 'Сервер недоступен. Попробуйте VPN.'; };
    setTimeout(() => { const s = document.getElementById('splash'); if(s && !s.classList.contains('fade-out')) window.showSplashError('Сервер не отвечает. Возможно, он заблокирован в вашем регионе.'); }, 20000);
  </script>
</body>
</html>
